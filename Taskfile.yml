version: "3"

tasks:
  install:
    desc: Install website dependencies (npm ci)
    cmds:
      - npm ci
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  site:format:
    desc: Format website sources (oxfmt)
    deps: [install]
    cmds:
      - npm run format

  site:format:check:
    desc: Check website formatting (oxfmt)
    deps: [install]
    cmds:
      - npm run format:check

  site:lint:
    desc: Lint TS/JS and Vue script blocks (oxlint)
    deps: [install]
    cmds:
      - npm run lint

  site:lint:fix:
    desc: Lint+fix TS/JS and Vue script blocks (oxlint)
    deps: [install]
    cmds:
      - npm run lint:fix

  site:lint:css:
    desc: Lint CSS (stylelint)
    deps: [install]
    cmds:
      - npm run lint:css

  site:lint:css:fix:
    desc: Lint+fix CSS (stylelint)
    deps: [install]
    cmds:
      - npm run lint:css:fix

  site:linkcheck:
    desc: Check internal built-site links and asset references
    deps: [install]
    cmds:
      - npm run docs:build
      - npm run linkcheck:internal

  md:lint:
    desc: Lint Markdown (markdownlint-cli2)
    deps: [install]
    cmds:
      - npm run lint:md

  md:lint:fix:
    desc: Lint+fix Markdown (markdownlint-cli2)
    deps: [install]
    cmds:
      - npm run lint:md:fix

  site:typecheck:
    desc: Typecheck VitePress config and theme (vue-tsc)
    deps: [install]
    cmds:
      - npm run typecheck

  site:typecheck:e2e:
    desc: Typecheck Playwright config and smoke tests (tsc)
    deps: [install]
    cmds:
      - npm run typecheck:e2e

  site:e2e:install:
    desc: Install Playwright Chromium browser
    deps: [install]
    cmds:
      - npm exec -- playwright install chromium

  site:e2e:install:deps:
    desc: Install Playwright Chromium browser and Linux OS dependencies
    deps: [install]
    cmds:
      - npm exec -- playwright install --with-deps chromium

  site:e2e:smoke:
    desc: Run website smoke E2E tests
    deps: [site:e2e:install]
    cmds:
      - npm run test:e2e:smoke

  site:audit:
    desc: Audit dependencies for moderate+ vulnerabilities (npm audit)
    deps: [install]
    cmds:
      - npm run audit

  site:verify:
    desc: Verify formatting, linting, typechecking, internal links, and production build
    deps: [install]
    cmds:
      - npm run verify

  fmt:
    desc: Run formatters and safe auto-fixes
    cmds:
      - task: site:format
      - task: site:lint:css:fix
      - task: md:lint:fix

  lint:
    desc: Run all linters and typechecks
    cmds:
      - task: site:format:check
      - task: site:lint
      - task: site:lint:css
      - task: md:lint
      - task: site:typecheck
      - task: site:typecheck:e2e

  audit:
    desc: Run dependency audit gate (moderate+)
    cmds:
      - task: site:audit

  test:
    desc: Run website smoke E2E tests
    cmds:
      - task: site:e2e:smoke

  check:
    desc: Full local verification, including audit and smoke E2E
    cmds:
      - task: site:verify
      - task: site:audit
      - task: site:e2e:smoke
