version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    ignore:
      # vitepress-plugin-mermaid (latest 2.0.17) only supports mermaid 10 or 11
      # as a peer dependency; a mermaid 12 bump breaks `npm ci`. Remove this
      # once the plugin accepts mermaid 12.
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
      - ci
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
