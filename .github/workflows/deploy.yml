# Verify and deploy the VitePress site to GitHub Pages
name: Verify and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily republish so a new hegemony-demo-data installer release
    # propagates to https://hegemony.sh/install.sh within a day
    - cron: "17 6 * * *"
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The platform documentation's source of truth lives in the platform
      # repository, changed atomically with code (Pillar 4 of its
      # documentation-system design record); the site pulls it at build time.
      # The daily scheduled run above keeps the published docs at most a day
      # behind the platform's default branch.
      #
      # Deploy-only: pull request builds (fork PRs get no secrets) build the
      # site without the platform docs, and the internal link check skips the
      # synced trees when they are absent. The platform repository now lives
      # at its final home, hegemony-sh/hegemony (default branch develop), but
      # is private until launch, so this checkout needs the secret
      # PLATFORM_REPO_TOKEN (fine-grained PAT, contents:read on that
      # repository); the repository variables PLATFORM_REPO (owner/name) and
      # PLATFORM_REPO_REF (branch) remain optional overrides. Once the
      # repository is public the default github.token suffices and the
      # secret can be removed.
      #
      # --allow-missing-docs: turns a checkout without a docs/ tree into a
      # clean skip - the site deploys without the platform section (pages
      # render links into it only when the synced artifacts exist) instead of
      # every push, scheduled, and manual deploy failing outright.
      - name: Checkout platform repository (documentation source)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.PLATFORM_REPO || 'hegemony-sh/hegemony' }}
          # Same fallback as the sync step below, so the checked-out revision
          # and the links the sync script generates always name the same ref.
          ref: ${{ vars.PLATFORM_REPO_REF || 'develop' }}
          token: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}
          path: .platform
          fetch-depth: 1

      - name: Sync platform documentation and API reference
        if: github.event_name != 'pull_request'
        env:
          PLATFORM_REPO: ${{ vars.PLATFORM_REPO || 'hegemony-sh/hegemony' }}
          PLATFORM_REPO_REF: ${{ vars.PLATFORM_REPO_REF || 'develop' }}
        run: node scripts/sync-platform-docs.mjs .platform --allow-missing-docs

      # Plugin documentation is owned by the step-plugin repository: every
      # wheel ships one page per handler, and the site publishes those pages
      # straight from that repository (scripts/sync-plugin-docs.mjs). While
      # it is private, the same PLATFORM_REPO_TOKEN PAT must also carry
      # contents:read on it (or point PLUGINS_REPO elsewhere); --allow-missing
      # keeps deploys green until that is configured. Must run after the
      # platform sync: it cross-links the synced step-handler reference page.
      - name: Checkout step-plugins repository (plugin documentation source)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.PLUGINS_REPO || 'hegemony-sh/hegemony-step-plugins' }}
          ref: ${{ vars.PLUGINS_REPO_REF || '' }}
          token: ${{ secrets.PLATFORM_REPO_TOKEN || github.token }}
          path: .plugins
          fetch-depth: 1

      - name: Sync plugin documentation
        if: github.event_name != 'pull_request'
        run: node scripts/sync-plugin-docs.mjs .plugins --allow-missing

      - name: Audit dependencies (moderate+ gate)
        run: npm run audit

      - name: Verify formatting, linting, typechecking, links, and build
        run: npm run verify

      - name: Install Playwright Chromium browser
        run: npm exec -- playwright install --with-deps chromium

      - name: Run smoke E2E tests
        run: npm run test:e2e:smoke

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: .playwright/report
          retention-days: 7
          if-no-files-found: ignore

      # Serve the demo installer at /install.sh (and /install) without
      # committing it to this repo: fetch it from the latest
      # hegemony-sh/hegemony-demo-data release and verify it against the
      # release's SHA256SUMS before it enters the Pages artifact. Must run
      # after `npm run verify` because `vitepress build` cleans dist.
      #
      # Private period: while hegemony-demo-data is private, this anonymous
      # release download returns 404, which would fail every push, scheduled,
      # and manual deploy at this step. The public `curl | sh` installer
      # cannot work against private repositories anyway, so it is dormant
      # until launch: set the repository variable INSTALLER_PUBLISH=off to
      # skip this step and let the site deploy without /install.sh. Revert
      # at launch by deleting the variable - the fetch below is unchanged
      # and takes over again.
      - name: Fetch and verify demo installer
        if: vars.INSTALLER_PUBLISH != 'off'
        run: |
          set -euo pipefail
          base="https://github.com/hegemony-sh/hegemony-demo-data/releases/latest/download"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 \
            -o .vitepress/dist/install.sh "$base/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 \
            -o "$RUNNER_TEMP/SHA256SUMS" "$base/SHA256SUMS"
          cd .vitepress/dist
          grep ' install.sh$' "$RUNNER_TEMP/SHA256SUMS" | sha256sum -c -
          sh -n install.sh
          cp install.sh install

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Archive Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          tar \
            --dereference --hard-dereference \
            --directory .vitepress/dist \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
