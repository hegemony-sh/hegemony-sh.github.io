# Verify and deploy the VitePress site to GitHub Pages
name: Verify and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily republish so a new hegemony-demo-data installer release
    # propagates to https://hegemony.sh/install.sh within a day
    - cron: "17 6 * * *"
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (moderate+ gate)
        run: npm run audit

      - name: Verify formatting, linting, typechecking, links, and build
        run: npm run verify

      - name: Install Playwright Chromium browser
        run: npm exec -- playwright install --with-deps chromium

      - name: Run smoke E2E tests
        run: npm run test:e2e:smoke

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: .playwright/report
          retention-days: 7
          if-no-files-found: ignore

      # Serve the demo installer at /install.sh (and /install) without
      # committing it to this repo: fetch it from the latest
      # tvarohohlavy/hegemony-demo-data release and verify it against the
      # release's SHA256SUMS before it enters the Pages artifact. Must run
      # after `npm run verify` because `vitepress build` cleans dist.
      - name: Fetch and verify demo installer
        run: |
          set -euo pipefail
          base="https://github.com/tvarohohlavy/hegemony-demo-data/releases/latest/download"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 \
            -o .vitepress/dist/install.sh "$base/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 \
            -o "$RUNNER_TEMP/SHA256SUMS" "$base/SHA256SUMS"
          cd .vitepress/dist
          grep ' install.sh$' "$RUNNER_TEMP/SHA256SUMS" | sha256sum -c -
          sh -n install.sh
          cp install.sh install

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Archive Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          tar \
            --dereference --hard-dereference \
            --directory .vitepress/dist \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
